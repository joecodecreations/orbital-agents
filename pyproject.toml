[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-agents"
version = "0.1.0"
description = "Run, watch and steer AI agents across your machines: a hub, a floating tracker, an iPhone/Mac app and a browser controller."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Direct Apple push from the hub (notifications.apns = true): ES256 provider tokens and HTTP/2.
push = ["cryptography>=42", "httpx[http2]>=0.27"]

[project.scripts]
orbital = "orbital.cli.main:main"

[tool.setuptools.packages.find]
include = ["orbital*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: operational checks against a running install (orbital test --live)",
  "slow: starts real servers",
]
