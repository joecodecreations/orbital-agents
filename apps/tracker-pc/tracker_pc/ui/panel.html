<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Satellite Tracker</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="root">
  <header id="bar" class="glass">
    <div class="bar-left pywebview-drag-region" title="Drag to move">
      <span id="status-dot" class="status-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="2.4" fill="currentColor"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
      <div class="bar-text pywebview-drag-region">
        <div class="bar-title pywebview-drag-region">Agent Satellite Tracker</div>
        <div id="bar-sub" class="bar-sub pywebview-drag-region">starting…</div>
      </div>
    </div>
    <div class="segmented" id="filter" role="tablist">
      <button data-filter="all" class="on">All</button>
      <button data-filter="ai">AI</button>
      <button data-filter="mine">Mine</button>
    </div>
    <button class="bar-btn" id="btn-history" title="History">
      <svg viewBox="0 0 24 24" width="15" height="15"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="bar-btn" id="btn-evidence" title="Screenshots from AI agents">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><circle cx="12" cy="13.3" r="3.3" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>
      <span id="evidence-badge" class="badge hidden"></span>
    </button>
    <button class="bar-btn" id="btn-add" title="Type an item">
      <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <button class="bar-btn" id="btn-more" title="More">
      <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
    </button>
  </header>

  <div id="menu" class="glass menu hidden"></div>
  <div id="typing" class="glass typing hidden">
    <input id="type-input" type="text" placeholder="What are you working on?" maxlength="400">
    <button id="type-ok" class="pill ok">Add</button>
  </div>
  <div id="toast" class="toast hidden"></div>

  <main id="active-view">
    <div id="bubbles" class="bubbles"></div>
    <div id="empty" class="empty glass hidden">Nothing in progress. Agents appear here when they run <code>orbital-track start</code>.</div>
    <section id="detail" class="glass card hidden"></section>
  </main>

  <main id="history-view" class="glass card hidden">
    <div class="history-head">
      <div class="segmented small" id="range">
        <button data-range="today" class="on">Today</button>
        <button data-range="week">This Week</button>
        <button data-range="month">This Month</button>
        <button data-range="all">All</button>
      </div>
      <input id="search" type="search" placeholder="Search history" spellcheck="false">
    </div>
    <div id="history-list"></div>
    <div class="history-foot">
      <span id="history-count"></span>
      <span class="pager">
        <button class="pill" id="page-prev">‹</button>
        <span id="page-label"></span>
        <button class="pill" id="page-next">›</button>
        <label class="page-size">Items per page
          <select id="page-size"><option>5</option><option selected>10</option><option>15</option><option>25</option><option>50</option><option>100</option></select>
        </label>
      </span>
    </div>
  </main>
</div>
<div id="lightbox" class="lightbox hidden"></div>
<script>/*__JS__*/</script>
</body>
</html>
