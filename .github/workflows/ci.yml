name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Unit and integration tests (no live, no slow)
        run: python -m pytest -m "not live and not slow" -q
      - name: Compile everything
        run: python -m compileall -q orbital feeds tests
      - name: Setup script syntax
        run: bash -n setup
      - name: Wizard dry run (non-interactive)
        run: |
          mkdir -p "$RUNNER_TEMP/fake-home"
          HOME="$RUNNER_TEMP/fake-home" ORBITAL_HOME="$RUNNER_TEMP/orbital-home" \
            python -m orbital.cli.main setup --dry-run --yes --role hub
          test ! -e "$RUNNER_TEMP/orbital-home/config.toml"   # a dry run writes nothing

  public-safety:
    name: Public-safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_public_safety.py -q

  tracker:
    name: Tracker (swift build + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        working-directory: apps/tracker
        run: swift build
      - name: Test
        working-directory: apps/tracker
        run: swift test

  app:
    name: App (unsigned Mac Catalyst build + unit tests on an iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Unsigned Mac Catalyst build
        run: bash apps/orbital-app/scripts/build.sh --mac
      # Builds the app for the simulator (unsigned) and runs OrbitalAgentsTests on an iPhone simulator.
      - name: Unit tests on an iPhone simulator
        run: bash apps/orbital-app/scripts/test.sh

  extension:
    name: Browser extension lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check every script
        run: find browser-extension -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: manifest is valid JSON
        run: python3 -c "import json; json.load(open('browser-extension/manifest.json'))"
